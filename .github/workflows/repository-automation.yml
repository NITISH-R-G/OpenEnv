name: Repository Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  analyze_and_document:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.3"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Dependencies
        run: uv sync --all-extras

      - name: Run Tests
        run: uv run pytest tests/ -m "not integration and not network and not docker" -v --tb=short

      - name: Run Linting
        run: uv run ruff check src/ tests/

      - name: Run Security Scans
        run: |
          uv pip install bandit
          uv run bandit -r . -ll -q -x ./.venv,./tests,./.git || true

      - name: Run Repo Analyzer
        run: uv run python scripts/repo_analyzer.py

      - name: Run AI Doc Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python scripts/ai_doc_agent.py

      - name: Generate Architecture Diagram
        run: uv run python scripts/doc_generator.py

      - name: Commit artifacts
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md ARCHITECTURE.md repo_graph.json || true
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore: auto-update docs, AI summaries, and architecture diagrams"
            git push
          else
            echo "No changes to commit"
          fi
